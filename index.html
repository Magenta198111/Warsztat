<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostyka</title>
<style>
body { background: #000; color: #0f0; font-family: monospace; padding: 20px; font-size: 13px; line-height: 1.5; }
.err { color: #f66; }
.warn { color: #fa0; }
.ok { color: #6f6; }
</style>
</head>
<body>
<div id="output"></div>

<script>
const out = document.getElementById('output');
function log(msg, cls) {
  out.innerHTML += '<div class="' + (cls || '') + '">' + msg + '</div>';
}

log('=== START DIAGNOSTYKI ===');
log('URL: ' + window.location.href);
log('');

log('Sprawdzanie Hub...');
window.Hub = { register: function(m) { log('OK: Zarejestrowano modul: ' + m.id, 'ok'); } };
log('Hub utworzony', 'ok');
log('');

log('Pobieranie modules.json...');
fetch('./modules.json?t=' + Date.now())
  .then(r => { 
    log('Odpowiedz serwera: ' + r.status, r.ok ? 'ok' : 'err'); 
    return r.text(); 
  })
  .then(txt => {
    log('Zawartosc modules.json:');
    log(txt, 'warn');
    log('');
    
    let list;
    try {
      list = JSON.parse(txt);
    } catch(e) {
      log('BLAD parsowania JSON: ' + e.message, 'err');
      return;
    }
    
    log('Liczba modulow: ' + list.length, 'ok');
    log('');
    
    list.forEach((mod, i) => {
      log('Ladowanie [' + i + ']: ' + mod.file);
      const s = document.createElement('script');
      s.src = mod.file;
      s.onload = () => log('  -> Skrypt sie zaladowal', 'ok');
      s.onerror = () => log('  -> BLAD: Plik nie istnieje!', 'err');
      document.body.appendChild(s);
    });
  })
  .catch(e => log('BLAD FETCH: ' + e.message, 'err'));

window.addEventListener('error', function(e) {
  log('BLAD JS: ' + e.message + ' (plik: ' + (e.filename || '?') + ', linia: ' + e.lineno + ')', 'err');
});
</script>
</body>
</html>
