<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace</title>
<style>
  body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
  #grid { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .tile { background: #111; border: 1px solid #333; padding: 16px; border-radius: 6px; cursor: pointer; }
  .tile h3 { margin: 0 0 6px 0; font-size: 16px; font-weight: 500; }
  .tile p { margin: 0; font-size: 13px; color: #888; }
  .tile:active { background: #222; }
</style>
</head>
<body>

<h2 style="text-align: center; font-size: 14px; letter-spacing: 1px; margin-bottom: 20px; color: #aaa;">WORKSPACE</h2>
<div id="grid"></div>

<script>
window.Hub = {
  register: function(mod) {
    console.log("Załadowano moduł:", mod.id);
    const grid = document.getElementById('grid');
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<h3>${mod.title}</h3><p>${mod.desc || ''}</p>`;
    tile.onclick = function() {
      alert("Kliknięto moduł: " + mod.title + "\n(Właściwy widok modułu dodamy za chwilę)");
    };
    grid.appendChild(tile);
  }
};

fetch('./modules.json?t=' + Date.now())
  .then(res => res.json())
  .then(list => {
    list.forEach(mod => {
      const script = document.createElement('script');
      script.src = mod.file;
      document.body.appendChild(script);
    });
  })
  .catch(err => {
    document.getElementById('grid').innerHTML = '<div style="color:red;">Błąd wczytywania modules.json</div>';
  });
</script>

</body>
</html>
