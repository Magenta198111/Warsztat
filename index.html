<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="./manifest.json">
<title>Warsztat</title>
<style>
:root {
  --bg-base: #101216;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1d222b 0%, var(--bg-base) 70%);
  --surface: #1d2229;
  --surface-light: #262d36;
  --ink: #eef0f4;
  --muted: #9aa3b0;
  --line: #2e3540;
  --accent: #7b90ff;
  --accent-ink: #0d1020;
  --danger: #ff8a80;
  --ok: #81c784;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0; background: var(--bg-gradient); background-attachment: fixed; color: var(--ink); min-height: 100vh;
  padding-bottom: 80px; overflow-x: hidden;
}

/* Animacje */
@keyframes slideUpFade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes viewEnter {
  from { opacity: 0; transform: scale(0.98) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Glassmorphism Header */
.topbar {
  position: sticky; top: 0; z-index: 100;
  padding: 20px 16px 16px;
  background: rgba(20, 23, 28, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  text-align: center;
}
.topbar-title { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

/* Główne menu */
.container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

/* Nowoczesne Kafelki */
.tile {
  background: linear-gradient(145deg, var(--surface-light), var(--surface));
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 22px;
  padding: 18px 16px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  cursor: pointer; box-shadow: var(--shadow);
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
  opacity: 0;
  animation: slideUpFade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.tile:active {
  transform: scale(0.94);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.tile-icon {
  font-size: 26px; background: rgba(0,0,0,0.25);
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 4px 8px rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.03);
}
.tile-title { font-weight: 700; font-size: 15px; line-height: 1.2; margin-top: 4px; }
.tile-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; opacity: 0.8; }

/* FAB (Przycisk +) */
.fab {
  position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px;
  border-radius: 22px; background: var(--accent); color: var(--accent-ink);
  font-size: 32px; border: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50; transition: transform 0.1s;
  box-shadow: 0 8px 24px rgba(123, 144, 255, 0.4), inset 0 2px 2px rgba(255,255,255,0.3);
}
.fab:active { transform: scale(0.9); }

/* Widoki */
#view-module { display: none; }
#view-module.active { display: block; animation: viewEnter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
#view-home.hidden { display: none; }
#view-home:not(.hidden) { animation: viewEnter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

/* Puste stany i błędy */
.empty-state {
  border: 2px dashed rgba(255,255,255,0.1); border-radius: 20px; padding: 40px 20px;
  text-align: center; color: var(--muted); grid-column: 1 / -1; margin-top: 20px;
  background: rgba(0,0,0,0.2);
}
#error-bar {
  position: fixed; bottom: 0; left: 0; width: 100%; background: var(--danger);
  color: #000; padding: 10px; font-size: 12px; z-index: 9999; display: none; font-weight: bold;
}

/* Style globalne dla modułów (zachowane, by nie psuć widoków) */
.card { 
  background: linear-gradient(145deg, var(--surface-light), var(--surface));
  border: 1px solid rgba(255,255,255,0.04); border-radius: 22px; padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
h2 { margin: 0 0 12px; font-size: 20px; letter-spacing: -0.02em; }
label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 14px; }
input[type=text], input[type=number], select, button, input[type=file], textarea { font: inherit; width: 100%; font-size: 15px; }
input[type=text], input[type=number], select, textarea { padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(0,0,0,0.2); color: var(--ink); outline: none; transition: border 0.2s; }
input[type=text]:focus, input[type=number]:focus, textarea:focus { border-color: var(--accent); }
input[type=file] { padding: 8px; border-radius: 14px; border: 1.5px dashed var(--line); background: rgba(0,0,0,0.1); color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 10px 0; }
button { padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
button:active { transform: scale(0.97); }
button.p { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 12px rgba(123, 144, 255, 0.2); }
.hidden { display: none !important; }
.i { font-size: 14px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
</style>
</head>
<body>

<div class="topbar">
  <h1 class="topbar-title" id="app-title">Warsztat</h1>
</div>

<main class="container" id="view-home">
  <div class="grid" id="modules-grid"></div>
</main>

<main class="container" id="view-module"></main>

<button class="fab" id="fab-add">+</button>

<div id="error-bar"></div>

<script>
window.Hub = (() => {
  const DB_NAME = "WarsztatDB";
  const DB_VER = 1;
  const STORE = "kv";
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
    return dbPromise;
  }

  const db = {
    async get(key, def = null) {
      try {
        const d = await openDB();
        return new Promise((res, rej) => {
          const req = d.transaction(STORE, "readonly").objectStore(STORE).get(key);
          req.onsuccess = () => res(req.result !== undefined ? req.result : def);
          req.onerror = () => rej(req.error);
        });
      } catch(e) { return def; }
    },
    async set(key, val) {
      try {
        const d = await openDB();
        return new Promise((res, rej) => {
          const req = d.transaction(STORE, "readwrite").objectStore(STORE).put(val, key);
          req.onsuccess = () => res(true);
          req.onerror = () => rej(req.error);
        });
      } catch(e) { return false; }
    }
  };

  const modules = new Map();
  let activeModule = null;
  let activeAbort = null;
  const elHome = document.getElementById("view-home");
  const elModule = document.getElementById("view-module");
  const elGrid = document.getElementById("modules-grid");
  const elTitle = document.getElementById("app-title");

  function cleanup() {
    if (activeAbort) { activeAbort.abort(); activeAbort = null; }
    if (activeModule && activeModule.unmount) {
      try { activeModule.unmount(); } catch(e) { console.error(e); }
    }
    activeModule = null;
    elModule.innerHTML = "";
  }

  function showHome(push = false) {
    cleanup();
    elModule.classList.remove("active");
    elHome.classList.remove("hidden");
    elTitle.textContent = "Warsztat";
    if (push) history.pushState({ view: "home" }, "", "./");
  }

  function openModule(id, push = true) {
    const mod = modules.get(id);
    if (!mod) return showHome();

    cleanup();
    elHome.classList.add("hidden");
    elModule.classList.add("active");
    elTitle.textContent = mod.title;

    activeModule = mod;
    activeAbort = new AbortController();

    if (push) history.pushState({ view: "module", id }, "", `#${id}`);
    
    mod.mount(elModule, activeAbort.signal);
    window.scrollTo(0, 0);
  }

  function register(mod) {
    modules.set(mod.id, mod);
    const empty = elGrid.querySelector('.empty-state');
    if (empty) empty.remove();

    const tile = document.createElement("div");
    tile.className = "tile";
    
    tile.style.animationDelay = (modules.size * 0.05) + "s";

    tile.innerHTML = `
      <div class="tile-icon">${mod.icon}</div>
      <div class="tile-title">${mod.title}</div>
      <div class="tile-desc">${mod.desc || ""}</div>
    `;
    tile.addEventListener("click", () => openModule(mod.id, true));
    elGrid.appendChild(tile);
  }

  window.addEventListener("popstate", () => {
    const hash = location.hash.replace(/^#/, "");
    if (hash && modules.has(hash)) openModule(hash, false);
    else showHome(false);
  });

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("fab-add").addEventListener("click", () => alert("Aby dodać moduł, wgraj plik do folderu 'modules' i dopisz go do 'modules.json'."));
    
    const initHash = location.hash.replace(/^#/, "");
    if (initHash && modules.has(initHash)) openModule(initHash, false);
  });

  return { db, register, openModule, showHome };
})();

async function loadModulesFromManifest() {
  try {
    const response = await fetch('./modules.json?t=' + Date.now());
    if (!response.ok) throw new Error("Brak manifestu");
    
    const modulesList = await response.json();
    
    if (!modulesList || modulesList.length === 0) {
      document.getElementById("modules-grid").innerHTML = `<div class="empty-state">Warsztat jest pusty.</div>`;
      return;
    }

    modulesList.forEach(mod => {
      const script = document.createElement("script");
      script.src = mod.file;
      script.onerror = () => console.error(`Nie załadowano: ${mod.file}`);
      document.body.appendChild(script);
    });

  } catch (err) {
    document.getElementById("modules-grid").innerHTML = `<div class="empty-state">Brak pliku modules.json.</div>`;
  }
}

window.addEventListener("DOMContentLoaded", loadModulesFromManifest);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: "SKIP_WAITING" });
          }
        });
      });
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  });
}

window.addEventListener('error', function(e) {
  const bar = document.getElementById('error-bar');
  bar.style.display = 'block';
  bar.textContent = 'BŁĄD: ' + e.message;
});
</script>

</body>
</html>
